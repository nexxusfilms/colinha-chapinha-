name: Testar fontes de candidatos

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Descobrir API do O Tempo
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          curl -sS -L -A "$UA" -m 60 "https://www.otempo.com.br/eleicoes/2026/candidatos/sao-paulo/deputado-estadual" -o ot.html
          echo "=== urls de API no HTML"; grep -o 'https\?://[a-z.-]*otempo[a-z.-]*/[^"'"'"' <>)]*' ot.html | sort -u | head -40
          echo "=== data-attributes"; grep -o 'data-[a-z-]*="[^"]\{0,120\}"' ot.html | grep -i -E 'api|endpoint|url|cargo|uf|ano' | sort -u | head -40
          echo "=== scripts"; grep -o '<script[^>]*src="[^"]*"' ot.html | head -30
          for s in $(grep -o '<script[^>]*src="[^"]*"' ot.html | grep -o 'src="[^"]*"' | cut -d'"' -f2 | grep -i -E 'eleic|candidat|clientlib' | head -8); do
            case "$s" in http*) url="$s";; *) url="https://www.otempo.com.br$s";; esac
            echo "=== JS $url"; curl -sS -L -A "$UA" -m 60 "$url" -o s.js; wc -c s.js
            grep -o '["'"'"'`][^"'"'"'`]*eleicoes-api[^"'"'"'`]*["'"'"'`]' s.js | sort -u | head -20
            grep -o '["'"'"'`]/api/[^"'"'"'`]*["'"'"'`]' s.js | sort -u | head -30
          done
          echo "=== HTML do Chapinha: trechos eleicoes-api"; curl -sS -L -A "$UA" -m 60 "https://www.otempo.com.br/eleicoes/2026/candidatos/sao-paulo/deputado-estadual/chapinha-da-vela-15026" -o ch.html
          grep -o 'eleicoes-api[^"'"'"' <>)]*' ch.html | sort -u | head -20
          echo "=== tentativas diretas"
          for u in \
            "https://eleicoes-api.otempo.com.br/api/2026/candidatos/SP/deputado-estadual" \
            "https://eleicoes-api.otempo.com.br/api/candidatos?ano=2026&uf=SP&cargo=7" \
            "https://eleicoes-api.otempo.com.br/api/2026/SP/7/candidatos" \
            "https://eleicoes-api.otempo.com.br/api/" ; do
            echo "--- $u"; curl -sS -A "$UA" -m 30 -o t.out -w "HTTP %{http_code} %{content_type}\n" "$u" || true; head -c 400 t.out; echo
          done
      - name: TSE dados abertos
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          for u in "https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_2026.zip" "https://divulgacandcontas.tse.jus.br/divulga/rest/v1/eleicao/ordinarias"; do
            echo "--- $u"; curl -sS -I -L -A "$UA" -m 60 "$u" | head -12 || true
          done
